      returns: list
  _generate_search_variant:
    type: sync
    module: backend.adk_agent
    args: [self, query, filters, attempt]
    params:
      returns: str
  _get_cache_key:
    type: sync
    module: backend.adk_agent
    args: [self, key]
    params:
      returns: str
  _get_cache_path:
    type: sync
    module: backend.adk_agent
    args: [self, cache_key]
    params:
      returns: Path
  _is_grant_expired:
    type: sync
    module: backend.adk_agent
