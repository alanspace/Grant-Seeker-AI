      returns: None

variables:
  GEMINI_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.writer_agent]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.adk_agent]
  GOOGLE_CSE_ID:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.adk_agent]
  SEARCH_PROVIDER:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.adk_agent]
  TAVILY_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.adk_agent]

files:
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*.json']
      caller: [clear]
  .json:
    type: literal
    actions: [read]
    params:
      caller: [_get_cache_path]
      path: [self.cache_dir]
  cache_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  cache_file:
    type: variable
    actions: [delete]
    params:
      caller: [cache_file.unlink]
  cache_path:
    type: variable
    actions: [read, delete, write]
    params:
      caller: [open, json.load, cache_path.unlink]
      alias: [f]
