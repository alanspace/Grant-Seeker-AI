    params:
      returns: Tuple
  _try_google_scraper:
    type: async
    module: backend.content_extractor
    args: [self, url, min_length]
    params:
      returns: Tuple
  _try_pdf_extraction:
    type: async
    module: backend.content_extractor
    args: [self, url, min_length]
